# Nightly backup of the production Waggle database.
#
# Every night at 02:00 IST: pg_dump of the database (tables, accounts, the
# storage index), encrypted with a passphrase, kept 30 days as a private
# artifact of this repository. Uploaded photos live in Supabase Storage, not in
# the database, and are not in this backup.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL     the production "Session pooler" connection string
#                       (Supabase > Connect > Session pooler), password included
#   BACKUP_PASSPHRASE   a long random passphrase, kept somewhere safe offline
#
# Restore (to a NEW project first, never straight over production):
#   gpg --decrypt waggle-YYYY-MM-DD.dump.gpg > waggle.dump
#   pg_restore --no-owner --no-privileges --clean --if-exists -d "<target url>" waggle.dump
name: Nightly database backup

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Add the SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets first."
            exit 1
          fi
          f="waggle-$(date -u +%Y-%m-%d).dump"
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage -f "$f"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"
          shred -u "$f"
          ls -la "$f.gpg"

      - name: Keep for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: waggle-db-${{ github.run_id }}
          path: waggle-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
