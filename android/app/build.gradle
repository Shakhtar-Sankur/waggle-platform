apply plugin: 'com.android.application'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace = "com.gigzen.waggle"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gigzen.waggle"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Waggle's first release, numbered as one.
        //
        // These were 7 and "1.6", carried over from Buzz on
        // com.masayaako.driver where versionCode 6 was the highest on Play.
        // That constraint died with the package change: Play sees a DIFFERENT
        // app, so this listing starts empty and accepts any versionCode as its
        // first upload. Keeping 1.6 would have claimed a release history this
        // listing does not have.
        //
        // From the first upload onward the usual rule returns: every later
        // upload needs a higher versionCode than the highest already accepted.
        //
        // 2 rather than 1 because several signed builds of "versionCode 1" have
        // now been installed on a test handset, and Android refuses to install
        // a build whose versionCode is not higher than the one already on the
        // device. Nothing has reached Play yet, so any value is still valid as
        // the first upload — this simply keeps the artefacts distinguishable.
        // 3: the build carrying the message-attachment delete fix, server-side
        // currency, the avatar read-back and the Arabic number isolation. Bumped
        // for the same reason 2 was — signed builds of versionCode 2 are already
        // installed on the test handset, and Android will not install over them
        // unless this number goes up.
        // 5: a clean rebuild of the same release, asked for so the handset gets
        // an artefact it will definitely accept. Nothing in the app changed
        // between 4 and 5 — 4 already carried the stat-tile restyle, verified by
        // reading the bundled stylesheet out of the signed APK.
        // 6: nine currencies added — Bolivia, Guatemala, Honduras, Nicaragua,
        // Paraguay, Venezuela, Algeria, Belarus and Moldova were all recognised
        // well enough to switch the UI language and then quoted their per-km
        // rate in US dollars. First bump since 3 that changes behaviour rather
        // than just producing a fresh artefact, hence the versionName move too.
        // 7: the app fills the screen. It was laid out INSIDE the system bars,
        // so a grey strip sat above the coloured band and a white one below the
        // nav — reported from a real handset, and invisible in any browser.
        // Also restores the options menu in a chat whose counterpart cannot be
        // resolved, where favourite, block and report were all unreachable.
        // 8: the edge-to-edge work in 7 was correct on a new phone and broke an
        // old one. windowLightNavigationBar is API 27+; setting a transparent
        // navigation bar alongside it in the DEFAULT resource bucket left
        // Android 7 and 8 with a see-through bar and white icons over a white
        // nav — invisible back and home buttons. The pair now lives in
        // values-v27 and the cutout mode in values-v28.
        // 9: a launch animation for the phones Android never gave one to.
        // The animated splash is API 31+, so 7 through 11 saw a still mark and
        // then the app. The web view draws the same W on those, and holds the
        // finished mark on 12+ so nobody watches it drawn twice.
        // 10: sign-in was unusable on Android 7 and 8. Drawing under the system
        // bars made the web view resize to the wrong height when the keyboard
        // opened, so the centred form became a strip at the top with the
        // window's white background below it. Edge-to-edge now starts at v27,
        // where it is verified; older releases keep the layout they had before
        // any of this. windowSoftInputMode is stated explicitly everywhere.
        versionCode 10
        versionName "1.3.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (localProperties.getProperty('release.keystore') != null) {
                storeFile file(localProperties.getProperty('release.keystore'))
                storePassword localProperties.getProperty('release.keystore.password')
                keyAlias localProperties.getProperty('release.key.alias')
                keyPassword localProperties.getProperty('release.key.password')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (localProperties.getProperty('release.keystore') != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
