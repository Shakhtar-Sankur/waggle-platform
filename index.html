<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets the app own the whole screen.
         Without it Android lays the web view out INSIDE the system bars, so
         the app sits in a letterbox with a grey strip above and a white one
         below — which is exactly what a web page looks like and not what an
         app does. It is also the switch that makes env(safe-area-inset-*)
         return real numbers; without it they are all 0, so the insets already
         written into this stylesheet were doing nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Waggle - a driver community app for gig workers to track, earn, and connect."
    />
    <title>Waggle</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
