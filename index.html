<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets the app own the whole screen.
         Without it Android lays the web view out INSIDE the system bars, so
         the app sits in a letterbox with a grey strip above and a white one
         below — which is exactly what a web page looks like and not what an
         app does. It is also the switch that makes env(safe-area-inset-*)
         return real numbers; without it they are all 0, so the insets already
         written into this stylesheet were doing nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Waggle - a driver community app for gig workers to track, earn, and connect."
    />
    <title>Waggle</title>
  </head>
  <body>
    <!-- Launch mark, drawn in the web view.
         Android 12 brought an animated splash screen and the app uses it, so a
         new phone draws the W stroke by stroke. There is no way to animate the
         native splash on anything older: Android 7 through 11 get a still mark
         and then the app, which is why the launch looked alive on one handset
         and flat on another.

         This closes that gap where it can be closed. It is inline — markup,
         style and script all in the document — because anything in the bundle
         arrives too late to be a launch screen. It matches the native splash
         exactly: same geometry, same indigo, same white.

         It only ANIMATES where the native one did not, so a phone on Android 12
         or newer is not made to watch the W drawn twice; there it simply holds
         the finished mark and fades, which keeps the handover seamless. -->
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 108 108" width="132" height="132">
        <g transform="translate(6.03 7.01) scale(1.95)">
          <path
            id="boot-w"
            d="M11,15 C 12.5,30 15,35 17.5,35 C 20,35 22.5,26 24,22 C 25.5,26 28,35 30.5,35 C 33,34 35,28 36,18"
            fill="none" stroke="#FFFFFF" stroke-width="4.6"
            stroke-linecap="round" stroke-linejoin="round" />
          <path id="boot-dot"
            d="M36.4,10.9 a4.1,4.1 0 1,1 0,8.2 a4.1,4.1 0 1,1 0,-8.2 Z"
            fill="#FFFFFF" />
        </g>
      </svg>
    </div>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #4F46E5;
        transition: opacity .34s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      /* Drawn only when this class is set, i.e. only where the native splash
         could not animate. Without it the mark is simply present. */
      #boot.draw #boot-w {
        stroke-dasharray: 120;
        stroke-dashoffset: 120;
        animation: boot-draw .72s cubic-bezier(.65,0,.35,1) forwards;
      }
      #boot.draw #boot-dot {
        opacity: 0;
        animation: boot-pop .3s cubic-bezier(.34,1.56,.64,1) .56s forwards;
      }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @keyframes boot-pop { from { opacity: 0; transform: scale(.4); }
                            to   { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #boot.draw #boot-w, #boot.draw #boot-dot { animation: none; }
        #boot.draw #boot-w { stroke-dashoffset: 0; }
        #boot.draw #boot-dot { opacity: 1; }
      }
    </style>
    <div id="root"></div>
    <!-- This script sits AFTER #root on purpose. It was above it, where
         getElementById("root") returned null, MutationObserver.observe threw on
         null, and the throw took the six-second safety net down with it — so the
         launch screen stayed up for ever. Caught before shipping only because
         the handover was actually watched rather than assumed. -->
    <script>
      (function () {
        var boot = document.getElementById("boot");
        // Android major version out of the user agent. Anything below 12 never
        // saw an animated splash, so this is where the animation is worth
        // playing. A non-Android web view reports nothing and is treated the
        // same way, since it had no native splash at all.
        var m = /Android (\d+)/.exec(navigator.userAgent);
        var major = m ? parseInt(m[1], 10) : 0;
        if (!m || major < 12) boot.classList.add("draw");

        // Hand over once the app has actually painted, not on a timer: a slow
        // handset is exactly the one that must not be shown an empty screen.
        // The ceiling is a safety net, so a failure to mount cannot leave the
        // launch screen up for ever.
        var done = false;
        function finish() {
          if (done) return;
          done = true;
          boot.classList.add("gone");
          setTimeout(function () { boot.remove(); }, 400);
        }
        window.__waggleBooted = finish;
        var root = document.getElementById("root");
        var seen = new MutationObserver(function () {
          if (root.childElementCount > 0) { seen.disconnect(); setTimeout(finish, 260); }
        });
        seen.observe(root, { childList: true });
        setTimeout(finish, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
